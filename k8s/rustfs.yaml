apiVersion: v1
kind: Service
metadata:
  name: rustfs
  namespace: app
spec:
  selector: { app: rustfs }
  ports:
    - port: 9000
      name: rustfs
      targetPort: 9000
    - port: 9001
      name: admin-panel
      targetPort: 9001
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rustfs
  namespace: app
  labels:
    app: rustfs
spec:
  serviceName: rustfs
  replicas: 1
  selector:
    matchLabels:
      app: rustfs
  template:
    metadata:
      labels:
        app: rustfs
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '9100'
        prometheus.io/path: /metrics
    spec:
      containers:
        - name: rustfs
          image: rustfs/rustfs:latest
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: secrets
          env:
            - name: RUSTFS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: secrets
                  key: S3_ACCESS_KEY
            - name: RUSTFS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: secrets
                  key: S3_SECRET_KEY
          ports:
            - containerPort: 9000
            - containerPort: 9001
          volumeMounts:
          - name: data
            mountPath: /data
          readinessProbe:
            tcpSocket:
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: '1'
              memory: 1Gi
        - name: storage-metrics
          image: quay.io/prometheus/node-exporter:v1.9.1
          args:
          - --collector.disable-defaults
          - --collector.filesystem
          - --collector.filesystem.mount-points-include=^/data$
          ports:
          - name: metrics
            containerPort: 9100
          volumeMounts:
          - name: data
            mountPath: /data
            readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            periodSeconds: 15
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
