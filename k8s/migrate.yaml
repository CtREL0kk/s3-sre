apiVersion: batch/v1
kind: Job
metadata:
  labels:
    deploy-stage: migration
  name: migrate
  namespace: app
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: migrate
    spec:
      initContainers:
        - name: wait-for-postgres
          image: postgres:alpine
          command: [ "/bin/sh", "-c", "until pg_isready -h postgres -p 5432; do sleep 1; done" ]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
      containers:
        - name: migrate
          image: myapp-backend:latest
          imagePullPolicy: Never
          command: [ "/usr/local/bin/server", "migrate" ]
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: secrets
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      restartPolicy: Never
