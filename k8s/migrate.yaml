apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  namespace: app
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: migrate
    spec:
      containers:
        - name: migrate
          image: myapp-backend:latest
          imagePullPolicy: Never
          command: [ "/bin/sh", "-c", "until nc -z postgres 5432; do sleep 1; done && /usr/local/bin/server migrate" ]
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: secrets
      restartPolicy: Never