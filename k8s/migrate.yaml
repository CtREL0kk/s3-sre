apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  namespace: app
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: migrate
    spec:
      initContainers:
        - name: wait-for-postgres
          image: postgres:alpine
          command: [ "/bin/sh", "-c", "until pg_isready -h postgres -p 5432; do sleep 1; done" ]
      containers:
        - name: migrate
          image: myapp-backend:latest
          imagePullPolicy: Never
          command: [ "/usr/local/bin/server", "migrate" ]
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: secrets
      restartPolicy: Never