apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      initContainers:
        - name: wait-for-postgres
          image: postgres:alpine
          command: [ "/bin/sh", "-c", "until pg_isready -h postgres -p 5432; do sleep 1; done" ]
        - name: wait-for-rustfs
          image: alpine:latest
          command: [ "/bin/sh", "-c", "until nc -z rustfs 9000; do echo 'Waiting for rustfs...'; sleep 1; done" ]
      containers:
        - name: app
          image: myapp-backend:latest
          imagePullPolicy: Never
          envFrom:
            - secretRef:
                name: secrets
            - configMapRef:
                name: app-config
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: app
spec:
  selector:
    app: app
  ports:
    - port: 80
      targetPort: 8080
