apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    deploy-stage: application
  name: app
  namespace: app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: "/metrics"
      labels:
        app: app
        logging: "true"
    spec:
      initContainers:
        - name: wait-for-postgres
          image: postgres:alpine
          command: [ "/bin/sh", "-c", "until pg_isready -h postgres -p 5432; do sleep 1; done" ]
        - name: wait-for-rustfs
          image: alpine:latest
          command: [ "/bin/sh", "-c", "until nc -z rustfs 9000; do echo 'Waiting for rustfs...'; sleep 1; done" ]
      containers:
        - name: app
          image: myapp-backend:latest
          imagePullPolicy: Never
          envFrom:
            - secretRef:
                name: secrets
            - configMapRef:
                name: app-config
          ports:
            - containerPort: 8080
            - containerPort: 8081

          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 30

          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: app
spec:
  selector:
    app: app
  ports:
    - port: 80
      targetPort: 8080
