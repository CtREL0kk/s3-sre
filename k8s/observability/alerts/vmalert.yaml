---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vmalert
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vmalert
  template:
    metadata:
      labels:
        app: vmalert
    spec:
      containers:
        - name: vmalert
          image: victoriametrics/vmalert:v1.128.0
          args: ["-datasource.url=http://vmsingle-victoria-metrics-single-server:8428", "-notifier.url=http://alertmanager:9093", "-rule=/config/rules.yaml"]
          ports:
            - containerPort: 8880
          readinessProbe:
            tcpSocket:
              port: 8880
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: s3-alert-rules
---
apiVersion: v1
kind: Service
metadata:
  name: vmalert
spec:
  selector:
    app: vmalert
  ports:
    - port: 8880
      targetPort: 8880
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alertmanager
  template:
    metadata:
      labels:
        app: alertmanager
    spec:
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.28.1
          args: ["--config.file=/config/alertmanager.yaml", "--storage.path=/tmp/alertmanager"]
          ports:
            - containerPort: 9093
          readinessProbe:
            tcpSocket:
              port: 9093
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: s3-alertmanager-config
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
spec:
  selector:
    app: alertmanager
  ports:
    - port: 9093
      targetPort: 9093
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-notifications
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alert-notifications
  template:
    metadata:
      labels:
        app: alert-notifications
    spec:
      containers:
        - name: alert-notifications
          image: python:3.13-alpine
          command: ["python3", "/config/receiver.py"]
          ports:
            - containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: 8080
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: s3-alert-receiver
---
apiVersion: v1
kind: Service
metadata:
  name: alert-notifications
spec:
  selector:
    app: alert-notifications
  ports:
    - port: 8080
      targetPort: 8080
