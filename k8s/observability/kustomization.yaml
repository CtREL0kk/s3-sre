apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - namespace.yaml
  - victoria-logs/deployment.yaml
  - victoria-logs/service.yaml
  - victoria-logs/pvc.yaml
  - vector/rbac.yaml
  - vector/configmap.yaml
  - vector/daemonset.yaml
  - alerts/vmalert.yaml
  - grafana/deployment.yaml

configMapGenerator:
  - name: s3-alert-rules
    files:
      - alerts/rules.yaml
  - name: s3-alertmanager-config
    files:
      - alerts/alertmanager.yaml
  - name: s3-alert-receiver
    files:
      - alerts/receiver.py

  - name: grafana-datasource
    files:
      - grafana/provisioning.yaml
  - name: grafana-providers
    files:
      - grafana/providers.yaml
  - name: grafana-dashboards
    files:
      - grafana/application.json
      - grafana/postgres.json
