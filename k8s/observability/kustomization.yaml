apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - namespace.yaml
  - victoria-logs/deployment.yaml
  - victoria-logs/service.yaml
  - victoria-logs/pvc.yaml
  - vector/rbac.yaml
  - vector/configmap.yaml
  - vector/daemonset.yaml
  - alerts/vmalert.yaml

configMapGenerator:
  - name: s3-alert-rules
    files:
      - alerts/rules.yaml
  - name: s3-alertmanager-config
    files:
      - alerts/alertmanager.yaml
  - name: s3-alert-receiver
    files:
      - alerts/receiver.py
